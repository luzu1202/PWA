name: Validar y publicar PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar JavaScript
        run: |
          node --check script.js
          node --check sw.js
      - name: Validar manifiesto y recursos
        run: |
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));if(m.display!=='standalone'||!m.name||!m.start_url)process.exit(1);for(const f of ['index.html','styles.css','script.js','sw.js','assets/icon.svg','assets/postre-placeholder.svg'])if(!fs.existsSync(f))throw Error('Falta '+f);console.log('Manifiesto PWA y recursos requeridos válidos')"

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
